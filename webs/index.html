<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skillpro | Үл Хөдлөх Хөрөнгө</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        .custom-modal { z-index: 99999 !important; }
        .leaflet-container { z-index: 1 !important; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen transition-colors duration-300 dark:bg-slate-900 dark:text-slate-100">

    <nav class="bg-blue-700 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-2xl font-black tracking-wider flex items-center gap-2 cursor-pointer" onclick="window.location.reload()">
                <i class="fa-solid fa-building-circle-check text-yellow-300"></i> SKILLPRO.MN
            </h1>
            <div class="flex items-center gap-4">
                <button id="filter-fav-btn" onclick="window.toggleFavoriteFilter()" class="bg-blue-800 hover:bg-blue-900 px-3 py-2 rounded-xl text-sm font-medium transition flex items-center gap-2 border border-blue-500/30 cursor-pointer">
                    <i class="fa-solid fa-heart text-red-400" id="fav-nav-icon"></i> <span id="fav-text">Хадгалсан</span>
                </button>
                <div id="auth-section" class="flex items-center gap-2"></div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        <aside class="lg:col-span-4 space-y-6">
            <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl shadow-xl space-y-4">
                <h3 class="font-bold text-lg flex items-center gap-2 text-blue-400"><i class="fa-solid fa-sliders"></i> Шүүлтүүр</h3>
                <div>
                    <label class="text-xs text-slate-400 font-semibold block mb-1">ӨРӨӨНИЙ ТОО</label>
                    <select id="filter-rooms" onchange="window.renderListings()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:border-blue-500 focus:outline-none text-slate-200">
                        <option value="all">Хамаагүй</option>
                        <option value="1">1 өрөө</option>
                        <option value="2">2 өрөө</option>
                        <option value="3">3 өрөө</option>
                        <option value="4+">4+ өрөө</option>
                    </select>
                </div>
            </div>

            <div id="add-listing-card" class="bg-slate-800 border border-slate-700 p-5 rounded-2xl shadow-xl space-y-4 hidden">
                <h3 class="font-bold text-lg flex items-center gap-2 text-blue-400"><i class="fa-solid fa-circle-plus"></i> Шинэ зар бүртгэх</h3>
                <form id="listing-form" onsubmit="window.handleCreateListing(event)" class="space-y-3">
                    <div>
                        <label class="text-xs text-slate-400 font-semibold block mb-1">ТӨРӨЛ СОНГОХ</label>
                        <select id="form-type" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:border-blue-500 focus:outline-none text-slate-200">
                            <option value="Rent">🔑 Түрээслүүлнэ</option>
                            <option value="Sale">💰 Худалдана</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 font-semibold block mb-1">БАЙРНЫ НЭР / ГАРЧИГ</label>
                        <input type="text" id="form-title" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:border-blue-500 focus:outline-none text-slate-200">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 font-semibold block mb-1">БАЙРШИЛ / ХАЯГ</label>
                        <input type="text" id="form-address" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:border-blue-500 focus:outline-none text-slate-200">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 font-semibold block mb-1">БҮТЭН ТАЙЛБАР</label>
                        <textarea id="form-description" rows="3" placeholder="Байрны давуу тал, орчин тойрны мэдээлэл..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:border-blue-500 focus:outline-none text-slate-200"></textarea>
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 font-semibold block mb-1">ГАЗРЫН ЗУРАГ ДЭЭР ЗООХ</label>
                        <button type="button" onclick="window.openMapModal()" class="w-full bg-slate-700 hover:bg-slate-600 text-white text-xs font-semibold py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 transition border border-slate-600 cursor-pointer">
                            <i class="fa-solid fa-map-location-dot"></i> <span id="map-btn-text">Байршил сонгох</span>
                        </button>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-xs text-slate-400 font-semibold block mb-1">ӨРӨӨ</label>
                            <input type="number" id="form-rooms" required min="1" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:border-blue-500 focus:outline-none text-slate-200">
                        </div>
                        <div>
                            <label class="text-xs text-slate-400 font-semibold block mb-1">ТАЛБАЙ (М²)</label>
                            <input type="number" id="form-area" required min="1" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:border-blue-500 focus:outline-none text-slate-200">
                        </div>
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 font-semibold block mb-1">ҮНЭ (₮)</label>
                        <input type="number" id="form-price" required min="1" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:border-blue-500 focus:outline-none text-slate-200">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 font-semibold block mb-1">УТАСНЫ ДУГААР</label>
                        <input type="text" id="form-phone" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:border-blue-500 focus:outline-none text-slate-200">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 font-semibold block mb-1">ЗУРАГ ОРУУЛАХ (МАКС 10)</label>
                        <input type="file" id="form-images" multiple accept="image/*" class="w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 file:cursor-pointer cursor-pointer">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition duration-200 text-sm cursor-pointer">Нэмэх</button>
                </form>
            </div>
        </aside>

        <main class="lg:col-span-8">
            <div id="listings-container" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </main>
    </div>

    <!-- MAP MODAL -->
    <div id="map-modal" class="fixed inset-0 bg-black/70 custom-modal hidden items-center justify-center p-4">
        <div class="bg-slate-800 rounded-2xl w-full max-w-3xl overflow-hidden shadow-2xl border border-slate-700 flex flex-col h-[80vh]">
            <div class="px-5 py-4 border-b border-slate-700 flex justify-between items-center bg-slate-800/50">
                <h3 class="font-bold text-lg flex items-center gap-2 text-blue-400"><i class="fa-solid fa-map-pin"></i> Газрын зураг дээр байршил заах</h3>
                <button onclick="window.closeMapModal()" class="text-slate-400 hover:text-white transition cursor-pointer"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="flex-1 relative bg-slate-900">
                <div id="map" class="absolute inset-0 w-full h-full"></div>
            </div>
            <div class="p-4 border-t border-slate-700 bg-slate-800/50 flex justify-end gap-3">
                <button onclick="window.closeMapModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-sm font-semibold transition cursor-pointer">Цуцлах</button>
                <button onclick="window.confirmMapLocation()" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 rounded-xl text-sm font-semibold transition shadow-md cursor-pointer">Байршил сонгох</button>
            </div>
        </div>
    </div>

    <!-- AUTH MODAL -->
    <div id="auth-modal" class="fixed inset-0 bg-black/70 custom-modal hidden items-center justify-center p-4">
        <div class="bg-slate-800 p-6 rounded-2xl w-full max-w-md shadow-2xl border border-slate-700 space-y-4">
            <div class="flex justify-between items-center">
                <h3 id="auth-modal-title" class="font-bold text-xl text-blue-400">Нэвтрэх</h3>
                <button onclick="window.closeAuthModal()" class="text-slate-400 hover:text-white transition cursor-pointer"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="auth-form" onsubmit="window.handleAuth(event)" class="space-y-3">
                <div>
                    <label class="text-xs text-slate-400 font-semibold block mb-1">ИМЭЙЛ ХАЯГ</label>
                    <input type="email" id="auth-email" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:border-blue-500 focus:outline-none text-slate-200">
                </div>
                <div>
                    <label class="text-xs text-slate-400 font-semibold block mb-1">НУУЦ ҮГ</label>
                    <input type="password" id="auth-password" required minlength="6" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:border-blue-500 focus:outline-none text-slate-200">
                </div>
                <button type="submit" id="auth-submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl shadow-lg transition text-sm cursor-pointer">Нэвтрэх</button>
            </form>
            <div class="text-center pt-2">
                <button onclick="window.toggleAuthMode()" id="auth-toggle-btn" class="text-xs text-blue-400 hover:underline cursor-pointer">Шинэ бүртгэл үүсгэх</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const SUPABASE_URL = "https://hoggxzvtlicaxoiyxnvv.supabase.co"
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhvZ2d4enZ0bGljYXhvaXl4bnZ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MTg3MDc2OTEsImV4cCI6MjAzNDI4MzY5MX0.bC1S9D8h_v7bWn-y1E_xZ_gE4y_O0_U4e_6e6b_8e6b"

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

        let currentUser = null
        let listings = []
        let favorites = []
        let filterFavoritesOnly = false

        let map, marker
        let selectedLat = 47.9188
        let selectedLng = 106.9176
        let tempLat = null, tempLng = null

        // INIT
        async function init() {
            const { data: { session } } = await supabase.auth.getSession()
            setUser(session?.user || null)

            supabase.auth.onAuthStateChange((_event, session) => {
                setUser(session?.user || null)
            })

            initMap()
            await fetchListings()
            loadFavorites()
            renderListings()
        }

        function setUser(user) {
            currentUser = user
            const authSection = document.getElementById('auth-section')
            const addListingCard = document.getElementById('add-listing-card')

            if (user) {
                authSection.innerHTML = `
                    <span class="text-xs text-slate-300 max-w-[120px] truncate font-medium bg-slate-800 border border-slate-700 px-3 py-2 rounded-xl">${user.email}</span>
                    <button onclick="window.handleLogout()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-xl text-sm font-semibold transition cursor-pointer">Гарах</button>
                `
                addListingCard.classList.remove('hidden')
            } else {
                authSection.innerHTML = `
                    <button onclick="window.openAuthModal('login')" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-semibold transition shadow-md cursor-pointer">Нэвтрэх</button>
                `
                addListingCard.classList.add('hidden')
            }
            renderListings()
        }

        // MAP FUNCTIONS
        function initMap() {
            map = L.map('map').setView([selectedLat, selectedLng], 13)
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map)

            marker = L.marker([selectedLat, selectedLng], { draggable: true }).addTo(map)

            map.on('click', (e) => {
                tempLat = e.latlng.lat
                tempLng = e.latlng.lng
                marker.setLatLng(e.latlng)
            })

            marker.on('dragend', () => {
                const pos = marker.getLatLng()
                tempLat = pos.lat
                tempLng = pos.lng
            })
        }

        window.openMapModal = () => {
            document.getElementById('map-modal').classList.remove('hidden')
            document.getElementById('map-modal').classList.add('flex')
            tempLat = selectedLat
            tempLng = selectedLng
            setTimeout(() => {
                map.invalidateSize()
                map.setView([selectedLat, selectedLng], 13)
                marker.setLatLng([selectedLat, selectedLng])
            }, 200)
        }

        window.closeMapModal = () => {
            document.getElementById('map-modal').classList.add('hidden')
            document.getElementById('map-modal').classList.remove('flex')
        }

        window.confirmMapLocation = () => {
            selectedLat = tempLat
            selectedLng = tempLng
            document.getElementById('map-btn-text').innerText = "✅ Байршил сонгогдсон"
            window.closeMapModal()
        }

        // AUTH
        let authMode = 'login'
        window.openAuthModal = (mode = 'login') => {
            authMode = mode
            document.getElementById('auth-modal').classList.remove('hidden')
            document.getElementById('auth-modal').classList.add('flex')
            updateAuthModalUI()
        }

        window.closeAuthModal = () => {
            document.getElementById('auth-modal').classList.add('hidden')
            document.getElementById('auth-modal').classList.remove('flex')
        }

        window.toggleAuthMode = () => {
            authMode = authMode === 'login' ? 'signup' : 'login'
            updateAuthModalUI()
        }

        function updateAuthModalUI() {
            document.getElementById('auth-modal-title').innerText = authMode === 'login' ? 'Нэвтрэх' : 'Бүртгүүлэх'
            document.getElementById('auth-submit-btn').innerText = authMode === 'login' ? 'Нэвтрэх' : 'Бүртгэл үүсгэх'
            document.getElementById('auth-toggle-btn').innerText = authMode === 'login' ? 'Шинэ бүртгэл үүсгэх' : 'Надад бүртгэл байгаа, нэвтрэх'
        }

        window.handleAuth = async (e) => {
            e.preventDefault()
            const email = document.getElementById('auth-email').value
            const password = document.getElementById('auth-password').value

            let error
            if (authMode === 'login') {
                ({ error } = await supabase.auth.signInWithPassword({ email, password }))
            } else {
                ({ error } = await supabase.auth.signUp({ email, password }))
                if (!error) alert('Бүртгэл амжилттай! Имэйлээ шалгаж баталгаажуулна уу.')
            }

            if (error) alert(error.message)
            else window.closeAuthModal()
        }

        window.handleLogout = async () => {
            await supabase.auth.signOut()
        }

        // DATA FLOW
        async function fetchListings() {
            const { data, error } = await supabase.from('listings').select('*').order('created_at', { ascending: false })
            if (error) console.error(error)
            else listings = data || []
        }

        window.handleCreateListing = async (e) => {
            e.preventDefault()
            if (!currentUser) return alert('Та нэвтэрсэн байх шаардлагатай!')

            const title = document.getElementById('form-title').value
            const address = document.getElementById('form-address').value
            const description = document.getElementById('form-description').value
            const type = document.getElementById('form-type').value
            const rooms = parseInt(document.getElementById('form-rooms').value)
            const area = parseInt(document.getElementById('form-area').value)
            const price = parseInt(document.getElementById('form-price').value)
            const phone = document.getElementById('form-phone').value
            const imageFiles = document.getElementById('form-images').files

            let imageUrls = []

            if (imageFiles.length > 0) {
                for (let i = 0; i < Math.min(imageFiles.length, 10); i++) {
                    const file = imageFiles[i]
                    const fileExt = file.name.split('.').pop()
                    const fileName = `${Date.now()}_${i}.${fileExt}`
                    
                    const { error: uploadError } = await supabase.storage
                        .from('apartments')
                        .upload(fileName, file)

                    if (uploadError) {
                        console.error(uploadError)
                    } else {
                        const { data: publicUrlData } = supabase.storage
                            .from('apartments')
                            .getPublicUrl(fileName)
                        imageUrls.push(publicUrlData.publicUrl)
                    }
                }
            }

            if (imageUrls.length === 0) {
                imageUrls.push('https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=800&q=80')
            }

            const { error } = await supabase.from('listings').insert([{
                user_id: currentUser.id,
                title,
                address,
                description,
                type,
                rooms,
                area,
                price,
                phone,
                images: imageUrls,
                lat: selectedLat,
                lng: selectedLng
            }])

            if (error) {
                alert(error.message)
            } else {
                document.getElementById('listing-form').reset()
                document.getElementById('map-btn-text').innerText = "Байршил сонгох"
                selectedLat = 47.9188
                selectedLng = 106.9176
                await fetchListings()
                renderListings()
            }
        }

        window.handleDelete = async (id) => {
            if (!confirm('Та энэ зарыг устгахдаа итгэлтэй байна уу?')) return
            const { error } = await supabase.from('listings').delete().eq('id', id)
            if (error) alert(error.message)
            else {
                await fetchListings()
                renderListings()
            }
        }

        // FAVORITES
        function loadFavorites() {
            favorites = JSON.parse(localStorage.getItem('skillpro_favs') || '[]')
        }

        window.toggleFavorite = (id) => {
            if (favorites.includes(id)) {
                favorites = favorites.filter(favId => favId !== id)
            } else {
                favorites.push(id)
            }
            localStorage.setItem('skillpro_favs', JSON.stringify(favorites))
            renderListings()
        }

        window.toggleFavoriteFilter = () => {
            filterFavoritesOnly = !filterFavoritesOnly
            const btn = document.getElementById('filter-fav-btn')
            const text = document.getElementById('fav-text')
            if (filterFavoritesOnly) {
                btn.classList.add('bg-red-600', 'hover:bg-red-700', 'border-red-500')
                text.innerText = "Зөвхөн Хадгалсан"
            } else {
                btn.classList.remove('bg-red-600', 'hover:bg-red-700', 'border-red-500')
                text.innerText = "Хадгалсан"
            }
            renderListings()
        }

        // RENDERING
        window.renderListings = () => {
            const container = document.getElementById('listings-container')
            const roomFilter = document.getElementById('filter-rooms').value

            let filtered = listings.filter(item => {
                if (filterFavoritesOnly && !favorites.includes(item.id)) return false
                if (roomFilter !== 'all') {
                    if (roomFilter === '4+') return item.rooms >= 4
                    return item.rooms === parseInt(roomFilter)
                }
                return true
            })

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12 bg-slate-800 rounded-2xl border border-slate-700 text-slate-400">
                        <i class="fa-solid fa-folder-open text-4xl mb-3 block text-slate-500"></i> Зарууд олдсонгүй.
                    </div>
                `
                return
            }

            container.innerHTML = filtered.map(item => {
                const isFav = favorites.includes(item.id)
                const isOwner = currentUser && currentUser.id === item.user_id
                const mainImage = item.images && item.images.length > 0 ? item.images[0] : 'https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=800&q=80'

                return `
                    <div class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-lg hover:shadow-xl transition duration-200 flex flex-col group relative">
                        <div class="relative aspect-video w-full overflow-hidden bg-slate-900">
                            <img src="${mainImage}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                            <span class="absolute top-3 left-3 text-xs font-bold px-2.5 py-1 rounded-lg shadow-md uppercase tracking-wider ${item.type === 'Rent' ? 'bg-green-600 text-white' : 'bg-amber-500 text-slate-900'}">
                                ${item.type === 'Rent' ? 'Түрээс' : 'Худалдана'}
                            </span>
                            <button onclick="window.toggleFavorite('${item.id}')" class="absolute top-3 right-3 bg-slate-900/60 hover:bg-slate-900/80 p-2 rounded-xl text-lg backdrop-blur-sm transition cursor-pointer">
                                <i class="${isFav ? 'fa-solid fa-heart text-red-500' : 'fa-regular fa-heart text-white'}"></i>
                            </button>
                        </div>
                        <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
                            <div class="space-y-1">
                                <h4 class="font-bold text-lg text-white line-clamp-1 capitalize">${item.title}</h4>
                                <p class="text-xl font-black text-blue-400">${item.price.toLocaleString()} ₮</p>
                                <p class="text-xs text-slate-400 flex items-center gap-1"><i class="fa-solid fa-location-dot text-blue-500"></i> ${item.address}</p>
                                ${item.description ? `<p class="text-xs text-slate-300 bg-slate-900/50 p-2 rounded-lg line-clamp-3 mt-2 border border-slate-700/40">${item.description}</p>` : ''}
                            </div>
                            <div class="flex items-center gap-2 text-xs font-semibold text-slate-300 pt-1">
                                <span class="bg-slate-700 px-2 py-1 rounded-md border border-slate-600">${item.rooms} өрөө</span>
                                <span class="bg-slate-700 px-2 py-1 rounded-md border border-slate-600">${item.area} м²</span>
                            </div>
                            <div class="pt-2 border-t border-slate-700/50 flex justify-between items-center gap-2">
                                <a href="tel:${item.phone}" class="text-xs font-bold text-blue-400 hover:underline flex items-center gap-1"><i class="fa-solid fa-phone"></i> ${item.phone}</a>
                                ${isOwner ? `
                                    <button onclick="window.handleDelete('${item.id}')" class="bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white px-2.5 py-1 rounded-lg text-xs font-bold transition cursor-pointer">Устгах</button>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `
            }).join('')
        }

        init()
    </script>
</body>
</html>
