<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skillpro | Үл Хөдлөх Хөрөнгө</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        .custom-modal { z-index: 99999 !important; }
        .leaflet-container { z-index: 1 !important; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen transition-colors duration-300 dark:bg-slate-900 dark:text-slate-100">

    <nav class="bg-blue-700 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-2xl font-black tracking-wider flex items-center gap-2 cursor-pointer" onclick="window.location.reload()">
                <i class="fa-solid fa-building-circle-check text-yellow-300"></i> SKILLPRO.MN
            </h1>
            <div class="flex items-center gap-4">
                <button id="filter-fav-btn" onclick="window.toggleFavoriteFilter()" class="bg-blue-800 hover:bg-blue-900 px-3 py-2 rounded-xl text-sm font-medium transition flex items-center gap-2 border border-blue-500/30 cursor-pointer">
                    <i class="fa-solid fa-heart text-red-400" id="fav-nav-icon"></i> <span id="fav-btn-text">Хадгалсан</span>
                </button>
                <div id="auth-status">
                    <button onclick="window.toggleAuthModal()" class="bg-yellow-500 text-slate-900 px-3 py-1.5 rounded-xl font-bold text-xs cursor-pointer">Нэвтрэх</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-4 lg:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">
        <div class="space-y-6 lg:col-span-1">
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                <h3 class="text-sm font-bold mb-3 text-blue-400 uppercase tracking-wider"><i class="fa-solid fa-filter"></i> Хайлт / Шүүлтүүр</h3>
                <div class="space-y-3">
                    <div>
                        <label class="text-xs font-semibold text-slate-400 uppercase">Төрөл</label>
                        <select id="search-type" onchange="window.applyFilters()" class="w-full mt-1 px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-sm text-white">
                            <option value="all">Бүгд</option>
                            <option value="Түрээслүүлнэ">Түрээслүүлнэ</option>
                            <option value="Зарагдана">Зарагдана</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-slate-400 uppercase">Өрөөний тоо</label>
                        <select id="search-rooms" onchange="window.applyFilters()" class="w-full mt-1 px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-sm text-white">
                            <option value="all">Хамаагүй</option>
                            <option value="1">1 өрөө</option>
                            <option value="2">2 өрөө</option>
                            <option value="3">3 өрөө</option>
                            <option value="4">4+ өрөө</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                <h2 id="form-title" class="text-lg font-extrabold mb-4"><i class="fa-solid fa-circle-plus text-blue-400"></i> <span>Шинэ зар бүртгэх</span></h2>
                <form id="apt-form" class="space-y-4">
                    <input type="hidden" id="edit-id" value="">
                    <div>
                        <label class="text-xs font-bold text-slate-400 uppercase block mb-1">Төрөл сонгох</label>
                        <select id="apt-type" onchange="window.onTypeChange()" class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-sm text-white" required>
                            <option value="Түрээслүүлнэ">🔑 Түрээслүүлнэ</option>
                            <option value="Зарагдана">💰 Зарагдана</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-400 uppercase block mb-1">Байрны нэр / Гарчиг</label>
                        <input type="text" id="apt-name" placeholder="Жишээ: Натур байр, Хангай хотхон..." class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-sm text-white" required>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-400 uppercase block mb-1">Байршил / Хаяг</label>
                        <input type="text" id="apt-address" placeholder="Жишээ: БЗД, 26-р хороо..." class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-sm text-white" required>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-400 uppercase block mb-1">Газрын зураг дээр зоох</label>
                        <button type="button" onclick="window.openMapPickModal()" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 py-2.5 px-4 rounded-xl text-xs font-bold border border-slate-600 flex items-center justify-center gap-2 transition cursor-pointer">
                            <i class="fa-solid fa-map-location-dot text-blue-400 text-sm"></i> 
                            <span id="map-btn-status">Газрын зураг дээр байршил заах</span>
                        </button>
                        <input type="hidden" id="apt-lat"><input type="hidden" id="apt-lng">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-xs font-semibold text-slate-400">ӨРӨӨ</label>
                            <input type="number" id="apt-rooms" value="1" class="w-full mt-1 px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-sm text-white" required>
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-slate-400">ТАЛБАЙ (М²)</label>
                            <input type="number" id="apt-area" value="50" class="w-full mt-1 px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-sm text-white" required>
                        </div>
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-slate-400">ҮНЭ (₮)</label>
                        <input type="number" id="apt-price" placeholder="Үнэ оруулна уу" class="w-full mt-1 px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-sm text-white" required>
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-slate-400">УТАСНЫ ДУГААР</label>
                        <input type="text" id="apt-phone" placeholder="Холбоо барих утас" class="w-full mt-1 px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-sm text-white" required>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-400 uppercase block mb-1">Зураг оруулах (Макс 10)</label>
                        <input type="file" id="apt-images" accept="image/*" multiple class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-blue-900 file:text-blue-200 hover:file:bg-blue-800 cursor-pointer">
                    </div>
                    <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-sm disabled:opacity-50 cursor-pointer">Нэмэх</button>
                </form>
            </div>
        </div>

        <div class="lg:col-span-3 space-y-4">
            <div class="bg-slate-800 p-3 rounded-2xl border border-slate-700 font-bold text-sm text-blue-400">
                Нийт зар: <span id="total-count-badge" class="text-white bg-blue-600 px-2 py-0.5 rounded-md ml-1">0</span>
            </div>
            <div id="apartments-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
            <div id="no-results" class="hidden text-center py-12 bg-slate-800 rounded-2xl"><p class="text-slate-400">Зар олдсонгүй.</p></div>
        </div>
    </main>

    <div id="map-pick-modal" class="fixed inset-0 bg-slate-950/80 hidden items-center justify-center custom-modal p-4 backdrop-blur-sm">
        <div class="bg-slate-800 rounded-3xl max-w-3xl w-full h-[80vh] flex flex-col overflow-hidden shadow-2xl relative border border-slate-700">
            <div class="p-4 border-b border-slate-700 flex justify-between items-center">
                <h3 class="font-extrabold text-base text-white"><i class="fa-solid fa-map-pin text-red-500 mr-1"></i> Газрын зураг дээр байршил заах</h3>
                <button type="button" onclick="window.closeMapPickModal()" class="text-slate-400 hover:text-white text-lg p-1 cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="form-map" class="w-full flex-1 bg-slate-900"></div>
            <div class="p-4 border-t border-slate-700 bg-slate-900/50 flex justify-end">
                <button type="button" onclick="window.closeMapPickModal()" class="bg-blue-600 text-white font-bold px-6 py-2 rounded-xl text-xs shadow hover:bg-blue-700 transition cursor-pointer">Байршлыг хадгалах</button>
            </div>
        </div>
    </div>

    <div id="auth-modal" class="fixed inset-0 bg-slate-950/70 hidden items-center justify-center custom-modal p-4 backdrop-blur-sm">
        <div class="bg-slate-800 rounded-3xl max-w-md w-full p-6 relative border border-slate-700">
            <button onclick="window.toggleAuthModal()" class="absolute top-4 right-4 text-slate-400 text-lg hover:text-white p-1 cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
            <h2 id="auth-title" class="text-xl font-black mb-4 text-center text-white">Нэвтрэх</h2>
            <div id="form-alert" class="hidden p-3 bg-red-900/50 text-red-200 border border-red-700 rounded-xl text-xs mb-3"></div>
            <form id="auth-form" class="space-y-4">
                <input type="email" id="auth-email" placeholder="Имэйл хаяг" class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-sm text-white" required>
                <input type="password" id="auth-password" placeholder="Нууц үг" class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-sm text-white" required>
                <button type="submit" id="auth-submit-btn" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl text-sm cursor-pointer">Нэвтрэх</button>
            </form>
            <div class="mt-4 text-center text-xs text-slate-400">
                <span id="auth-toggle-text">Бүртгэл байхгүй юу?</span>
                <button onclick="window.switchAuthMode()" id="auth-toggle-btn" class="text-blue-400 font-bold ml-1 cursor-pointer">Бүртгүүлэх</button>
            </div>
        </div>
    </div>

    <div id="detail-modal" class="fixed inset-0 bg-slate-950/80 hidden items-center justify-center custom-modal p-4 backdrop-blur-md">
        <div class="bg-slate-800 rounded-3xl max-w-5xl w-full h-[90vh] md:h-[85vh] overflow-hidden relative flex flex-col md:flex-row shadow-2xl border border-slate-700">
            <button onclick="window.closeDetailModal()" class="absolute top-4 right-4 bg-black/60 text-white w-10 h-10 rounded-full flex items-center justify-center text-lg z-50 hover:bg-black/80 transition cursor-pointer">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="w-full md:w-1/2 h-1/2 md:h-full bg-slate-950 relative flex items-center justify-center overflow-hidden">
                <div id="modal-slider" class="w-full h-full flex transition-transform duration-300 ease-in-out"></div>
                <button id="modal-prev-btn" class="absolute left-4 bg-black/40 text-white w-10 h-10 rounded-full flex items-center justify-center z-10"><i class="fa-solid fa-chevron-left"></i></button>
                <button id="modal-next-btn" class="absolute right-4 bg-black/40 text-white w-10 h-10 rounded-full flex items-center justify-center z-10"><i class="fa-solid fa-chevron-right"></i></button>
                <span id="modal-photo-count" class="absolute bottom-4 left-4 bg-black/60 text-white text-xs font-bold px-3 py-1 rounded-full z-10">1/1</span>
            </div>
            <div class="w-full md:w-1/2 h-1/2 md:h-full p-6 flex flex-col justify-between overflow-y-auto border-t md:border-t-0 md:border-l border-slate-700">
                <div class="space-y-4">
                    <div>
                        <span id="modal-badge" class="text-[10px] font-black px-2.5 py-1 rounded-full text-white uppercase shadow-sm"></span>
                        <h2 id="modal-title" class="text-xl font-black mt-2 text-white"></h2>
                        <p id="modal-price" class="text-2xl font-black text-blue-400 mt-1"></p>
                    </div>
                    <div class="grid grid-cols-2 gap-2 text-center text-xs font-bold text-slate-300">
                        <div class="bg-slate-700/50 p-2 rounded-xl"><p class="text-slate-400 text-[10px] uppercase font-medium">Өрөөний тоо</p><span id="modal-rooms" class="text-sm"></span></div>
                        <div class="bg-slate-700/50 p-2 rounded-xl"><p class="text-slate-400 text-[10px] uppercase font-medium">Талбай</p><span id="modal-area" class="text-sm"></span></div>
                    </div>
                    <div class="text-xs bg-slate-700/30 p-3 rounded-xl">
                        <p class="text-slate-400 font-bold uppercase text-[10px] mb-1"><i class="fa-solid fa-location-dot text-blue-400"></i> Хаяг байршил</p>
                        <p id="modal-address" class="text-slate-200 font-semibold mb-2"></p>
                        <div id="view-map" class="w-full h-44 bg-slate-900 rounded-xl overflow-hidden shadow-inner"></div>
                    </div>
                </div>
                <div class="pt-4 border-t border-slate-700 mt-4">
                    <a id="modal-phone-link" href="#" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-2xl text-center flex items-center justify-center gap-2 transition"><i class="fa-solid fa-phone"></i> Холбоо барих: <span id="modal-phone"></span></a>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

        const SUPABASE_URL = 'https://hoggxzvtlicaxoiyxnvv.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_NrUX1EvZn1ZAXNdeDwQgkw_DT78oeRE';

        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let currentUser = null;
        let isSignUpMode = false;
        let allApartments = [];
        let favoriteIds = JSON.parse(localStorage.getItem('fav_apts')) || [];
        let showFavoritesOnly = false;
        let modalImages = [];
        let currentModalImageIndex = 0;

        let formMap = null, formMarker = null;
        let viewMap = null, viewMarker = null;
        const DEFAULT_CENTER = [47.9188, 106.9176]; 

        const authStatus = document.getElementById('auth-status');
        const authModal = document.getElementById('auth-modal');
        const authForm = document.getElementById('auth-form');
        const formAlert = document.getElementById('form-alert');
        const grid = document.getElementById('apartments-grid');
        const noResults = document.getElementById('no-results');
        const aptForm = document.getElementById('apt-form');

        window.openMapPickModal = function() {
            document.getElementById('map-pick-modal').classList.remove('hidden');
            document.getElementById('map-pick-modal').classList.add('flex');
            setTimeout(() => {
                if (!formMap) {
                    formMap = L.map('form-map').setView(DEFAULT_CENTER, 13);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(formMap);
                    formMap.on('click', (e) => setFormMarker(e.latlng.lat, e.latlng.lng));
                } else { formMap.invalidateSize(); }
                const savedLat = document.getElementById('apt-lat').value;
                const savedLng = document.getElementById('apt-lng').value;
                if (savedLat && savedLng) {
                    formMap.setView([savedLat, savedLng], 15);
                    setFormMarker(parseFloat(savedLat), parseFloat(savedLng));
                }
            }, 200);
        }

        window.closeMapPickModal = function() {
            document.getElementById('map-pick-modal').classList.add('hidden');
            document.getElementById('map-pick-modal').classList.remove('flex');
        }

        function setFormMarker(lat, lng) {
            if (formMarker) { formMarker.setLatLng([lat, lng]); } 
            else {
                formMarker = L.marker([lat, lng], { draggable: true }).addTo(formMap);
                formMarker.on('dragend', (e) => {
                    document.getElementById('apt-lat').value = e.target.getLatLng().lat;
                    document.getElementById('apt-lng').value = e.target.getLatLng().lng;
                });
            }
            document.getElementById('apt-lat').value = lat;
            document.getElementById('apt-lng').value = lng;
            document.getElementById('map-btn-status').innerHTML = `<i class="fa-solid fa-circle-check text-green-400"></i> Байршил сонгогдсон`;
        }

        supabaseClient.auth.onAuthStateChange((event, session) => {
            currentUser = session?.user || null;
            updateAuthUI();
            fetchApartments();
        });

        function updateAuthUI() {
            if (currentUser) {
                authStatus.innerHTML = `<div class="flex items-center gap-2 bg-slate-700 px-3 py-1 rounded-xl text-xs border border-slate-600"><span class="truncate max-w-[100px] font-semibold text-slate-200">${currentUser.email}</span><button id="logout-btn" class="bg-red-500 hover:bg-red-600 text-white px-2 py-0.5 rounded font-bold cursor-pointer">Гарах</button></div>`;
                document.getElementById('logout-btn').onclick = async () => { await supabaseClient.auth.signOut(); window.location.reload(); };
            } else {
                authStatus.innerHTML = `<button onclick="window.toggleAuthModal()" class="bg-yellow-500 hover:bg-yellow-600 text-slate-900 px-4 py-2 rounded-xl font-bold text-xs shadow-sm cursor-pointer">Нэвтрэх</button>`;
            }
        }

        window.toggleAuthModal = function() {
            authModal.classList.toggle('hidden');
            if(!authModal.classList.contains('hidden')) authModal.classList.add('flex');
            formAlert.classList.add('hidden');
        }

        window.switchAuthMode = function() {
            isSignUpMode = !isSignUpMode;
            document.getElementById('auth-title').innerText = isSignUpMode ? "Бүртгүүлэх" : "Нэвтрэх";
            document.getElementById('auth-submit-btn').innerText = isSignUpMode ? "Бүртгүүлэх" : "Нэвтрэх";
            document.getElementById('auth-toggle-btn').innerText = isSignUpMode ? "Нэвтрэх" : "Бүртгүүлэх";
        }

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            formAlert.classList.add('hidden');
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            try {
                if (isSignUpMode) {
                    const { error } = await supabaseClient.auth.signUp({ email, password });
                    if (error) throw error;
                    alert('Амжилттай бүртгэгдлээ!');
                } else {
                    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                }
                window.toggleAuthModal();
            } catch (err) {
                formAlert.innerText = err.message;
                formAlert.classList.remove('hidden');
            }
        });

        async function fetchApartments() {
            try {
                const { data, error } = await supabaseClient.from('apartments').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                allApartments = data || [];
                window.applyFilters();
            } catch (err) { console.error(err.message); }
        }

        window.applyFilters = function() {
            let filtered = [...allApartments];
            
            const searchType = document.getElementById('search-type').value;
            if (searchType !== 'all') filtered = filtered.filter(apt => apt.type === searchType);
            
            if (showFavoritesOnly) filtered = filtered.filter(apt => favoriteIds.includes(apt.id));
            
            const rooms = document.getElementById('search-rooms').value;
            if (rooms !== 'all') filtered = filtered.filter(apt => apt.rooms == rooms);
            
            document.getElementById('total-count-badge').innerText = filtered.length;
            renderGrid(filtered);
        }

        window.toggleFavorite = function(id, e) {
            e.stopPropagation();
            favoriteIds = favoriteIds.includes(id) ? favoriteIds.filter(f => f !== id) : [...favoriteIds, id];
            localStorage.setItem('fav_apts', JSON.stringify(favoriteIds));
            window.applyFilters();
        }

        window.toggleFavoriteFilter = function() {
            showFavoritesOnly = !showFavoritesOnly;
            document.getElementById('filter-fav-btn').classList.toggle('bg-red-500');
            document.getElementById('fav-btn-text').innerText = showFavoritesOnly ? "Бүгд" : "Хадгалсан";
            window.applyFilters();
        }

        function renderGrid(data) {
            grid.innerHTML = '';
            if (data.length === 0) { noResults.classList.remove('hidden'); return; }
            noResults.classList.add('hidden');

            data.forEach(apt => {
                const isFav = favoriteIds.includes(apt.id);
                const isOwner = currentUser && apt.user_id === currentUser.id;
                let imgs = [];
                if (apt.image_url) {
                    try { imgs = JSON.parse(apt.image_url); if (!Array.isArray(imgs)) imgs = [apt.image_url]; } catch(e) { imgs = apt.image_url.split(','); }
                }
                if (imgs.length === 0 || imgs[0] === "") imgs = ['https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?q=80&w=400'];

                const card = document.createElement('div');
                card.className = "bg-slate-800 rounded-3xl overflow-hidden border border-slate-700/60 p-4 relative flex flex-col justify-between cursor-pointer hover:border-slate-500 transition duration-200";
                card.onclick = () => window.openDetailModal(apt);

                card.innerHTML = `
                    <div class="relative h-48 bg-slate-900 rounded-2xl overflow-hidden mb-3 flex items-center">
                        <img src="${imgs[0].trim()}" class="w-full h-full object-cover">
                        <span class="absolute top-3 left-3 text-[10px] font-black px-2.5 py-1 rounded-full text-white uppercase shadow-sm z-20 ${apt.type==='Зарагдана'?'bg-emerald-500':'bg-orange-500'}">${apt.type}</span>
                        <button onclick="window.toggleFavorite(${apt.id}, event)" class="absolute top-3 right-3 bg-slate-900/80 p-2 rounded-full shadow z-20 hover:scale-105 transition cursor-pointer">
                            <i class="${isFav ? 'fa-solid fa-heart text-red-500' : 'fa-regular fa-heart text-slate-400'}"></i>
                        </button>
                    </div>
                    <div class="mt-1 flex-1 flex flex-col">
                        <h4 class="font-bold text-base truncate mb-0.5 text-white">${apt.name}</h4>
                        <p class="text-blue-400 font-black text-base mb-1.5">${Number(apt.price).toLocaleString()} ₮</p>
                        <p class="text-[11px] text-slate-400 truncate mb-2"><i class="fa-solid fa-location-dot text-blue-400"></i> ${apt.address}</p>
                        <div class="flex gap-2 text-[11px] text-slate-300 bg-slate-700 px-2 py-1 rounded-lg mb-2 font-semibold w-max">
                            <span>${apt.rooms} өрөө</span> | <span>${apt.area} м²</span>
                        </div>
                    </div>
                    <div class="flex justify-between items-center border-t pt-2.5 mt-auto border-slate-700">
                        <span class="text-xs text-slate-300 font-bold"><i class="fa-solid fa-phone text-blue-400 mr-0.5"></i> ${apt.phone}</span>
                        ${isOwner ? `<div class="flex gap-1" onclick="event.stopPropagation();">
                            <button id="del-btn-${apt.id}" class="text-[11px] bg-red-500 text-white px-2 py-1 rounded-md font-bold hover:bg-red-600 cursor-pointer">Устгах</button>
                        </div>`:''}
                    </div>`;
                grid.appendChild(card);

                if(isOwner) {
                    document.getElementById(`del-btn-${apt.id}`).onclick = () => window.deleteApartment(apt.id);
                }
            });
        }

        window.openDetailModal = function(apt) {
            document.getElementById('modal-title').innerText = apt.name;
            document.getElementById('modal-price').innerText = `${Number(apt.price).toLocaleString()} ₮`;
            document.getElementById('modal-rooms').innerText = `${apt.rooms} өрөө`;
            document.getElementById('modal-area').innerText = `${apt.area} м²`;
            document.getElementById('modal-address').innerText = apt.address;
            document.getElementById('modal-phone').innerText = apt.phone;
            document.getElementById('modal-phone-link').href = `tel:${apt.phone}`;

            const badge = document.getElementById('modal-badge');
            badge.innerText = apt.type;
            badge.className = `text-[10px] font-black px-2.5 py-1 rounded-full text-white uppercase shadow-sm ${apt.type === 'Зарагдана' ? 'bg-emerald-500' : 'bg-orange-500'}`;

            if (apt.image_url) {
                try { modalImages = JSON.parse(apt.image_url); if (!Array.isArray(modalImages)) modalImages = [apt.image_url]; } catch(e) { modalImages = apt.image_url.split(','); }
            }
            if (modalImages.length === 0 || modalImages[0] === "") modalImages = ['https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?q=80&w=800'];

            currentModalImageIndex = 0;
            renderModalImages();

            document.getElementById('detail-modal').classList.remove('hidden');
            document.getElementById('detail-modal').classList.add('flex');

            setTimeout(() => {
                if (!viewMap) {
                    viewMap = L.map('view-map').setView(DEFAULT_CENTER, 14);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(viewMap);
                } else { viewMap.invalidateSize(); }

                if (apt.lat && apt.lng) {
                    const pos = [apt.lat, apt.lng];
                    viewMap.setView(pos, 16); 
                    if (viewMarker) viewMarker.setLatLng(pos);
                    else viewMarker = L.marker(pos).addTo(viewMap);
                } else {
                    if (viewMarker) viewMap.removeLayer(viewMarker);
                    viewMarker = null;
                    viewMap.setView(DEFAULT_CENTER, 12);
                }
            }, 200);
        }

        function renderModalImages() {
            const slider = document.getElementById('modal-slider');
            slider.innerHTML = '';
            modalImages.forEach(url => {
                const img = document.createElement('img');
                img.src = url.trim();
                img.className = "w-full h-full object-contain flex-shrink-0 bg-slate-950";
                slider.appendChild(img);
            });
            document.getElementById('modal-prev-btn').style.display = modalImages.length > 1 ? 'flex' : 'none';
            document.getElementById('modal-next-btn').style.display = modalImages.length > 1 ? 'flex' : 'none';
            updateModalSliderPosition();
        }

        function updateModalSliderPosition() {
            document.getElementById('modal-slider').style.transform = `translateX(-${currentModalImageIndex * 100}%)`;
            document.getElementById('modal-photo-count').innerText = `${currentModalImageIndex + 1}/${modalImages.length}`;
        }

        document.getElementById('modal-prev-btn').onclick = (e) => {
            e.stopPropagation();
            currentModalImageIndex = (currentModalImageIndex === 0) ? modalImages.length - 1 : currentModalImageIndex - 1;
            updateModalSliderPosition();
        };

        document.getElementById('modal-next-btn').onclick = (e) => {
            e.stopPropagation();
            currentModalImageIndex = (currentModalImageIndex === modalImages.length - 1) ? 0 : currentModalImageIndex + 1;
            updateModalSliderPosition();
        };

        window.closeDetailModal = function() {
            document.getElementById('detail-modal').classList.add('hidden');
            document.getElementById('detail-modal').classList.remove('flex');
        }

        aptForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) { alert('Зар нэмэхийн тулд нэвтрэх шаардлагатай!'); return; }
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;

            const fileInput = document.getElementById('apt-images');
            let uploadedUrls = [];

            if (fileInput.files.length > 0) {
                const files = Array.from(fileInput.files).slice(0, 10);
                for (let file of files) {
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${Math.random()}_${Date.now()}.${fileExt}`;
                    const filePath = `${currentUser.id}/${fileName}`;
                    const { error: uploadError } = await supabaseClient.storage.from('apartments').upload(filePath, file);
                    if (!uploadError) {
                        const { data: publicUrlData } = supabaseClient.storage.from('apartments').getPublicUrl(filePath);
                        uploadedUrls.push(publicUrlData.publicUrl);
                    }
                }
            }

            const latVal = document.getElementById('apt-lat').value;
            const lngVal = document.getElementById('apt-lng').value;

            const aptData = {
                type: document.getElementById('apt-type').value,
                name: document.getElementById('apt-name').value,
                address: document.getElementById('apt-address').value,
                rooms: parseInt(document.getElementById('apt-rooms').value),
                area: parseInt(document.getElementById('apt-area').value),
                price: parseFloat(document.getElementById('apt-price').value),
                phone: document.getElementById('apt-phone').value,
                lat: latVal ? parseFloat(latVal) : null,
                lng: lngVal ? parseFloat(lngVal) : null,
                user_id: currentUser.id,
                image_url: JSON.stringify(uploadedUrls)
            };

            try {
                const { error } = await supabaseClient.from('apartments').insert([aptData]);
                if(error) throw error;
                aptForm.reset();
                document.getElementById('map-btn-status').innerText = "Газрын зураг дээр байршил заах";
                if (formMarker && formMap) { formMap.removeLayer(formMarker); formMarker = null; }
                fetchApartments();
            } catch (err) { alert(err.message); } 
            finally { submitBtn.disabled = false; }
        });

        window.deleteApartment = async function(id) {
            if (confirm('Та энэ зарыг устгахдаа итгэлтэй байна уу?')) {
                await supabaseClient.from('apartments').delete().eq('id', id);
                fetchApartments();
            }
        }
    </script>
</body>
</html>
